version: "1.0"
defaults:
  domain: "example.com"
  influx_bucket: "proxmox"

entities:
  node.pve1:
    type: proxmox_node
    ip: 192.168.1.10
    role: "Primary Proxmox Hypervisor"
    hardware:
      cpu_sensor: "coretemp-isa-0000"
      gpu_device: "/dev/dri/renderD128"
    environment_sensors:
      provider: home_assistant
      ambient_temp_entity: "sensor.server_room_thermostat_temperature"
      power_wattage_entity: "sensor.server_smart_plug_power"

  vm.truenas:
    type: proxmox_vm
    hosted_on: node.pve1
    vmid: 100
    ip: 192.168.1.100
    role: "TrueNAS ZFS Storage Appliance"
    storage_exports:
      media_nfs:
        protocol: nfs
        export_path: "/mnt/tank/media"
        zfs_pool: "tank"

  vm.docker:
    type: proxmox_vm
    hosted_on: node.pve1
    vmid: 110
    ip: 192.168.1.110
    role: "Linux Docker Host VM"

  lxc.nginx:
    type: proxmox_lxc
    hosted_on: node.pve1
    vmid: 201
    ip: 192.168.1.201
    role: "Nginx Reverse Proxy"
    health_check:
      local_url: "https://192.168.1.201:443"

  lxc.cloudflared:
    type: proxmox_lxc
    hosted_on: node.pve1
    vmid: 202
    ip: 192.168.1.202
    role: "Cloudflare Argo Tunnel"

  lxc.jellyfin:
    type: proxmox_lxc
    hosted_on: node.pve1
    vmid: 210
    ip: 192.168.1.210
    role: "Jellyfin Media Server"
    hardware_passthrough:
      - "/dev/dri/renderD128"
    health_check:
      local_url: "http://192.168.1.210:8096/health"
      external_url: "https://jellyfin.example.com/health"
      expected_status: 200
    telemetry:
      service_name: "jellyfin"
      loki_query: '{job="promtail", host="jellyfin"}'
    mounts:
      - provider: vm.truenas
        export: media_nfs
        mount_point: "/mnt/media"
        critical: true
    depends_on:
      - target: vm.truenas
        relationship: nfs_storage
        critical: true
      - target: lxc.nginx
        relationship: reverse_proxy
        critical: false
      - target: lxc.cloudflared
        relationship: argo_tunnel
        critical: false

  vm.docker.navidrome:
    type: docker_container
    hosted_on: vm.docker
    container_name: "navidrome"
    compose_path: "/opt/stacks/navidrome/docker-compose.yml"
    role: "Navidrome Music Streamer"
    health_check:
      local_url: "http://192.168.1.110:4533/ping"
      external_url: "https://music.example.com/ping"
    mounts:
      - provider: vm.truenas
        export: media_nfs
        mount_point: "/music"
        critical: true
    depends_on:
      - target: vm.docker
        relationship: compute_host
        critical: true
      - target: vm.truenas
        relationship: nfs_storage
        critical: true
      - target: lxc.nginx
        relationship: reverse_proxy
        critical: false
